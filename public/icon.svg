<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="50%" stop-color="#111318" />
      <stop offset="100%" stop-color="#0B0D11" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D1E4FF" />
      <stop offset="100%" stop-color="#70A7FF" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282C34" />
      <stop offset="100%" stop-color="#1C1F26" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#70A7FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#33353A" stroke-width="4" stroke-opacity="0.6" />

  <!-- Inner Elevated Tile -->
  <rect x="64" y="64" width="384" height="384" rx="72" fill="url(#cardGrad)" stroke="#3A3E48" stroke-width="2" />

  <!-- Candlesticks / Trading Columns -->
  <!-- Candle 1 -->
  <line x1="140" y1="180" x2="140" y2="340" stroke="#70A7FF" stroke-width="4" stroke-linecap="round" opacity="0.6" />
  <rect x="124" y="210" width="32" height="90" rx="8" fill="#70A7FF" opacity="0.8" />

  <!-- Candle 2 -->
  <line x1="220" y1="140" x2="220" y2="360" stroke="#34D399" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  <rect x="204" y="170" width="32" height="140" rx="8" fill="url(#greenGlow)" />

  <!-- Candle 3 Hero -->
  <line x1="300" y1="120" x2="300" y2="380" stroke="#D1E4FF" stroke-width="5" stroke-linecap="round" />
  <rect x="282" y="150" width="36" height="170" rx="10" fill="url(#blueGlow)" filter="url(#glow)" />

  <!-- Math Symbol: Division / Dot Ref -->
  <circle cx="385" cy="200" r="14" fill="#D1E4FF" />
  <rect x="365" y="240" width="40" height="10" rx="5" fill="#D1E4FF" />
  <circle cx="385" cy="290" r="14" fill="#D1E4FF" />

  <!-- Trend Curve Line -->
  <path d="M 110 320 Q 220 280 290 190 T 410 140" fill="none" stroke="#FBBF24" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 0" />
</svg>
